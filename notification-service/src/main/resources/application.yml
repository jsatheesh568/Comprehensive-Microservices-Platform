server:
  port: 8084

spring:
  application:
    name: notification-service
  
  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # RABBITMQ CONFIGURATION
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Acknowledge mode: AUTO (ack after processing) or MANUAL (manual ack)
        acknowledge-mode: auto
        # Retry configuration
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

# EUREKA CLIENT CONFIGURATION
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ACTUATOR CONFIGURATION
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# LOGGING
logging:
  level:
    com.arval.notification: DEBUG
    org.springframework.amqp: DEBUG
