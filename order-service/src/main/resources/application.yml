server:
  port: 8081

spring:
  application:
    name: order-service
  
  # DATASOURCE CONFIGURATION
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA/HIBERNATE CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: create-drop  # Creates tables on startup, drops on shutdown
    show-sql: true  # Logs SQL queries (useful for debugging)
    properties:
      hibernate:
        format_sql: true  # Formats SQL in logs
  
  # RABBITMQ CONFIGURATION - Asynchronous Communication
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Connection pool settings
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3

# EUREKA CLIENT CONFIGURATION
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# RESILIENCE4J CONFIGURATION
# These configurations apply to @CircuitBreaker and @Retry annotations

resilience4j:
  # CIRCUIT BREAKER CONFIGURATION
  circuitbreaker:
    configs:
      default:
        # Failure rate threshold (percentage)
        failure-rate-threshold: 50
        # Wait duration before transitioning from OPEN to HALF_OPEN
        wait-duration-in-open-state: 10s
        # Sliding window size (number of calls)
        sliding-window-size: 10
        # Minimum number of calls before calculating failure rate
        minimum-number-of-calls: 5
        # Permitted number of calls in HALF_OPEN state
        permitted-number-of-calls-in-half-open-state: 3
        # Automatically transition from OPEN to HALF_OPEN
        automatic-transition-from-open-to-half-open-enabled: true
        # Record these exceptions as failures
        record-exceptions:
          - java.lang.RuntimeException
          - java.lang.Exception
    instances:
      paymentService:
        baseConfig: default
      inventoryService:
        baseConfig: default
      orderOrchestration:
        baseConfig: default
  
  # RETRY CONFIGURATION
  retry:
    configs:
      default:
        # Maximum number of retry attempts
        max-attempts: 3
        # Wait duration between retries
        wait-duration: 1s
        # Enable exponential backoff
        enable-exponential-backoff: true
        # Exponential backoff multiplier
        exponential-backoff-multiplier: 2
        # Maximum wait duration
        max-wait-duration: 10s
        # Retry on transient failures
        retry-exceptions:
          - java.lang.RuntimeException
    instances:
      paymentService:
        baseConfig: default
      inventoryService:
        baseConfig: default
      orderOrchestration:
        baseConfig: default

  # BULKHEAD CONFIGURATION - Isolates order orchestration
  bulkhead:
    configs:
      default:
        # Max concurrent order creations
        max-concurrent-calls: 25
        # Don't wait for threads
        max-wait-duration: 0
        thread-pool:
          # Core threads for saga orchestration
          core-thread-pool-size: 10
          # Max threads if load spikes
          max-thread-pool-size: 20
          # Queue pending requests
          queue-capacity: 15
    instances:
      orderOrchestration:
        baseConfig: default
      paymentService:
        max-concurrent-calls: 15
        max-wait-duration: 0
        thread-pool:
          core-thread-pool-size: 5
          max-thread-pool-size: 10
          queue-capacity: 8
      inventoryService:
        max-concurrent-calls: 20
        max-wait-duration: 0
        thread-pool:
          core-thread-pool-size: 5
          max-thread-pool-size: 15
          queue-capacity: 10

  # TIME LIMITER CONFIGURATION - Prevents hanging saga steps
  timelimiter:
    configs:
      default:
        # Timeout saga steps after 10 seconds
        timeout-duration: 10s
        # Cancel future if timeout
        cancel-running-future: true
      paymentCall:
        # Payment calls should timeout faster (5 seconds)
        timeout-duration: 5s
        cancel-running-future: true
      inventoryCall:
        # Inventory calls should timeout faster (4 seconds)
        timeout-duration: 4s
        cancel-running-future: true
    instances:
      orderOrchestration:
        baseConfig: default
      paymentService:
        baseConfig: paymentCall
      inventoryService:
        baseConfig: inventoryCall

# ACTUATOR CONFIGURATION
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries,bulkheads,timelimiters
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# LOGGING CONFIGURATION
logging:
  level:
    com.arval.orders: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    io.github.resilience4j: DEBUG
